<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestureSlides — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.13);
      --glass-hover: rgba(255,255,255,0.1);
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.45);
      --accent: #a78bfa;
      --accent2: #f472b6;
      --accent3: #38bdf8;
      --success: #4ade80;
      --error: #f87171;
    }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif; overflow: hidden;
      background: #080612; color: var(--text);
    }

    /* ── Background ── */
    .bg { position: fixed; inset: 0; z-index: 0; }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(90px); opacity: 0.5;
      animation: orbFloat ease-in-out infinite alternate;
    }
    .orb-1 { width: 650px; height: 650px; background: radial-gradient(circle, #5b21b6 0%, transparent 65%); top: -180px; left: -120px; animation-duration: 9s; }
    .orb-2 { width: 550px; height: 550px; background: radial-gradient(circle, #9d174d 0%, transparent 65%); bottom: -130px; right: -80px; animation-duration: 11s; animation-delay: -4s; }
    .orb-3 { width: 400px; height: 400px; background: radial-gradient(circle, #0e7490 0%, transparent 65%); top: 45%; left: 55%; animation-duration: 7s; animation-delay: -2s; }
    .orb-4 { width: 280px; height: 280px; background: radial-gradient(circle, #1e3a8a 0%, transparent 65%); top: 12%; right: 22%; animation-duration: 13s; animation-delay: -6s; }
    @keyframes orbFloat {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 40px) scale(1.06); }
    }

    /* Grid lines */
    .grid {
      position: fixed; inset: 0; z-index: 1;
      background-image:
        linear-gradient(rgba(167,139,250,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(167,139,250,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Noise */
    .noise {
      position: fixed; inset: 0; z-index: 2; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    /* Particles */
    .particles { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; border-radius: 50%;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0%   { transform: translateY(110vh) translateX(0); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 0.7; }
      100% { transform: translateY(-10vh) translateX(var(--dx)); opacity: 0; }
    }

    /* ── Card ── */
    .card {
      position: relative; z-index: 10;
      width: 100%; max-width: 430px; margin: 20px;
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 52px 44px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 40px 100px rgba(0,0,0,0.5), 0 0 80px rgba(91,33,182,0.18);
      animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card::before {
      content: ''; position: absolute;
      top: 0; left: 15%; right: 15%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167,139,250,0.7), rgba(244,114,182,0.5), transparent);
    }
    .card::after {
      content: ''; position: absolute;
      bottom: 0; left: 30%; right: 30%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56,189,248,0.3), transparent);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px; font-weight: 800;
      text-align: center; margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa 0%, #f472b6 50%, #38bdf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: -0.5px;
    }
    .tagline {
      text-align: center; font-size: 13px; color: var(--muted);
      margin-bottom: 38px; letter-spacing: 0.02em;
    }
    .tagline span { color: var(--accent); opacity: 0.8; }

    /* ── Tabs ── */
    .tabs {
      display: flex; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 5px; margin-bottom: 30px; gap: 5px;
    }
    .tab {
      flex: 1; padding: 10px; text-align: center; background: none; border: none;
      color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 11px;
      transition: all 0.25s ease;
    }
    .tab.active {
      background: var(--glass-hover); color: var(--text);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }

    /* ── Forms ── */
    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; animation: fadeSlide 0.3s ease both; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
    }
    input {
      background: rgba(0,0,0,0.35); border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 14px 18px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px;
      outline: none; transition: all 0.2s; backdrop-filter: blur(8px);
    }
    input:focus {
      border-color: rgba(167,139,250,0.55);
      background: rgba(0,0,0,0.45);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.1), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    input::placeholder { color: rgba(240,238,255,0.2); }

    .btn {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #6d28d9, #be185d);
      color: white; border: none; border-radius: 14px; padding: 15px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 6px; transition: all 0.25s; letter-spacing: 0.01em;
      box-shadow: 0 4px 20px rgba(109,40,217,0.35);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(109,40,217,0.45); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
    }
    .btn::after {
      content: ''; position: absolute; top: 0; left: -120%;
      width: 55%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: skewX(-15deg); animation: btnShimmer 3.5s 1s infinite;
    }
    @keyframes btnShimmer { 0% { left: -120%; } 40% { left: 160%; } 100% { left: 160%; } }

    .msg {
      padding: 12px 16px; border-radius: 12px; font-size: 13px;
      display: none; backdrop-filter: blur(8px);
    }
    .msg.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25); color: var(--success); display: block; }
    .msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: var(--error); display: block; }
  </style>
</head>
<body>
<div class="bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>
<div class="grid"></div>
<div class="noise"></div>
<div class="particles" id="particles"></div>

<div class="card">
  <div class="logo">GestureSlides</div>
  <div class="tagline"><span>✦</span> Present smarter, gesture-first</div>

  <div id="msgBox" class="msg"></div>

  <div class="tabs">
    <button class="tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
    <button class="tab" id="signupTab" onclick="switchTab('signup')">Create Account</button>
  </div>

  <div class="form active" id="loginForm">
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="your_username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Sign In →</button>
  </div>

  <div class="form" id="signupForm">
    <div class="field">
      <label>Username</label>
      <input type="text" id="signupUser" placeholder="choose_username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="signupPass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="signupPass2" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn" id="signupBtn" onclick="doSignup()">Create Account ✦</button>
  </div>
</div>

<script>
  // Particles
  const pc = document.getElementById('particles');
  const colors = ['rgba(167,139,250,0.7)', 'rgba(244,114,182,0.6)', 'rgba(56,189,248,0.5)', 'rgba(255,255,255,0.4)'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 1 + Math.random() * 2.5;
    p.style.cssText = `
      left:${Math.random()*100}vw;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${10+Math.random()*16}s;
      animation-delay:${-Math.random()*25}s;
      --dx:${(Math.random()*120-60)}px;
    `;
    pc.appendChild(p);
  }

  function switchTab(tab) {
    ['login','signup'].forEach(t => {
      document.getElementById(t+'Tab').classList.toggle('active', t===tab);
      document.getElementById(t+'Form').classList.toggle('active', t===tab);
    });
    clearMsg();
  }
  function showMsg(text, type) {
    const b = document.getElementById('msgBox');
    b.textContent = text; b.className = 'msg ' + type;
  }
  function clearMsg() { document.getElementById('msgBox').className = 'msg'; }

  function doLogin() {
    const btn = document.getElementById('loginBtn');
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    if (!username || !password) { showMsg('Please fill in all fields.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Signing in...';
    fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) })
      .then(r=>r.json()).then(data => {
        if (data.success) { showMsg('✓ Welcome back, '+data.username+'!', 'success'); setTimeout(()=>location.href='/', 800); }
        else { showMsg('✗ '+data.error,'error'); btn.disabled=false; btn.textContent='Sign In →'; }
      }).catch(()=>{ showMsg('Connection error.','error'); btn.disabled=false; btn.textContent='Sign In →'; });
  }

  function doSignup() {
    const btn = document.getElementById('signupBtn');
    const username = document.getElementById('signupUser').value.trim();
    const password = document.getElementById('signupPass').value;
    const password2 = document.getElementById('signupPass2').value;
    if (!username||!password||!password2) { showMsg('Please fill in all fields.','error'); return; }
    if (password!==password2) { showMsg('Passwords do not match.','error'); return; }
    if (password.length<4) { showMsg('Password must be at least 4 characters.','error'); return; }
    btn.disabled=true; btn.textContent='Creating account...';
    fetch('/api/signup', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) })
      .then(r=>r.json()).then(data => {
        if (data.success) { showMsg('✓ Account created! Redirecting...','success'); setTimeout(()=>location.href='/', 800); }
        else { showMsg('✗ '+data.error,'error'); btn.disabled=false; btn.textContent='Create Account ✦'; }
      }).catch(()=>{ showMsg('Connection error.','error'); btn.disabled=false; btn.textContent='Create Account ✦'; });
  }

  document.addEventListener('keydown', e => {
    if (e.key==='Enter') {
      document.getElementById('loginForm').classList.contains('active') ? doLogin() : doSignup();
    }
  });
</script>
</body>
</html>
